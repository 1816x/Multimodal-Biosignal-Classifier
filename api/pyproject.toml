[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biosignal-api"
version = "0.1.0.dev0"
description = "FastAPI service for the multimodal biosignal classifier (educational prototype, NOT a medical device)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]   # httpx backs FastAPI's TestClient
explain = ["anthropic>=0.40"]          # Phase 3 — Claude API explanation layer

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
