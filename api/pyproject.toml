[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biosignal-api"
version = "0.1.0.dev0"
description = "FastAPI service for the multimodal biosignal classifier (educational prototype, NOT a medical device)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]   # httpx backs FastAPI's TestClient
# Phase 1 — serving the trained model. The sibling `biosignal-model` package must
# also be installed (editable): `pip install -e model`. torch is loaded lazily so
# the service (health/info) still runs without this extra.
predict = ["torch>=2.2", "numpy>=1.26", "scipy>=1.11"]
explain = ["anthropic>=0.40"]          # Phase 3 — Claude API explanation layer

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
