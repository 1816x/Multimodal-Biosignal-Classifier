[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biosignal-model"
version = "0.1.0"
description = "Multimodal biosignal classifier — preprocessing + PyTorch model (educational prototype, NOT a medical device)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
# PyTorch is heavy; it is only needed once training starts (Phase 1). Keeping it
# out of the base install lets the package import and the smoke tests run fast.
train = ["torch>=2.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
