# Full stack: FastAPI service + Next.js dashboard.
# Educational prototype — NOT a medical device.
#
#   docker compose up --build
#     dashboard -> http://localhost:3000   (talks to the api service via its proxy)
#     api       -> http://localhost:8000
#
# Without a trained checkpoint mounted, the api returns 503 for /predict and
# /report and the dashboard shows its badged demo data — the intended honest
# default. To serve real predictions, uncomment the api `volumes` block below
# and point it at a checkpoint produced by `python -m biosignal_model.train`.
# For live /report, set ANTHROPIC_API_KEY (e.g. in a repo-root .env file).

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      MODEL_CHECKPOINT: /app/model/checkpoints/multimodal_phase2.pt
    # volumes:
    #   - ./model/checkpoints:/app/model/checkpoints:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
